<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Trip Countdown</title>
  <style>
    :root{
      --bg1:#fff1f2;
      --bg2:#eff6ff;
      --card:#ffffffee;
      --text:#1f2937;
      --muted:#6b7280;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .container{
      width:min(920px,100%);
      background:var(--card);
      border-radius:24px;
      box-shadow:0 20px 50px rgba(0,0,0,.12);
      padding:40px 28px;
      text-align:center;
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(2rem,5vw,3.5rem);
    }
    .subtitle{
      color:var(--muted);
      font-size:1.05rem;
      line-height:1.7;
      margin:0 auto 26px;
      max-width:760px;
    }
    .countdown{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
      margin:26px 0 22px;
    }
    .box{
      background:#fff;
      border-radius:20px;
      padding:24px 14px;
      box-shadow:0 10px 25px rgba(0,0,0,.06);
    }
    .number{
      font-size:clamp(2.3rem,6vw,4rem);
      font-weight:800;
      line-height:1;
      margin-bottom:10px;
    }
    .label{
      color:var(--muted);
      font-weight:600;
    }
    .info{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-top:18px;
    }
    .pill{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:999px;
      padding:10px 14px;
      color:#374151;
      box-shadow:0 6px 16px rgba(0,0,0,.04);
    }
    .done{
      font-size:1.2rem;
      font-weight:700;
      margin-top:12px;
    }
    @media (max-width: 760px){
      .countdown{
        grid-template-columns:repeat(2,1fr);
      }
      .container{
        padding:32px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇯🇵 Countdown ไปญี่ปุ่น</h1>
    <p class="subtitle">
      เว็บนี้จะนับถอยหลังโดยอิงกับ <strong>เวลาจริงของประเทศไทย</strong> ทุกครั้งที่เปิดหน้าเว็บ<br>
      เที่ยวบินออกวันที่ <strong>11/04/2026 เวลา 08:00 น.</strong> (เวลาไทย)
    </p>

    <div class="countdown">
      <div class="box">
        <div class="number" id="days">00</div>
        <div class="label">วัน</div>
      </div>
      <div class="box">
        <div class="number" id="hours">00</div>
        <div class="label">ชั่วโมง</div>
      </div>
      <div class="box">
        <div class="number" id="minutes">00</div>
        <div class="label">นาที</div>
      </div>
      <div class="box">
        <div class="number" id="seconds">00</div>
        <div class="label">วินาที</div>
      </div>
    </div>

    <div class="info">
      <div class="pill" id="targetText">เวลาเครื่องบินขึ้น: 11/04/2026 08:00 (ประเทศไทย)</div>
      <div class="pill" id="nowText">กำลังโหลดเวลาปัจจุบัน...</div>
    </div>

    <div class="done" id="doneText"></div>
  </div>

  <script>
    const bangkokTZ = 'Asia/Bangkok';

    // 11 April 2026, 08:00 Thailand time (UTC+7) = 2026-04-11T01:00:00Z
    const targetTime = new Date('2026-04-11T01:00:00Z').getTime();

    function pad(n){
      return String(n).padStart(2,'0');
    }

    function formatBangkokNow(date){
      return new Intl.DateTimeFormat('th-TH', {
        timeZone: bangkokTZ,
        dateStyle: 'full',
        timeStyle: 'medium'
      }).format(date);
    }

    function updateCountdown(){
      const now = new Date();
      document.getElementById('nowText').textContent =
        'เวลาปัจจุบันในไทย: ' + formatBangkokNow(now);

      let diff = targetTime - now.getTime();

      if(diff <= 0){
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.getElementById('doneText').textContent = 'ถึงเวลาออกเดินทางแล้ว ✈️🇯🇵';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
      document.getElementById('doneText').textContent = '';
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
