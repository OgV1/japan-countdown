<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan Countdown - Sakura Edition</title>
  <style>
    :root{
      --bg-top:#fff6fb;
      --bg-bottom:#eef7ff;
      --card:rgba(255,255,255,0.78);
      --card-border:rgba(255,255,255,0.7);
      --text:#1f2937;
      --muted:#6b7280;
      --pink:#f472b6;
      --pink-soft:#fce7f3;
      --blue:#60a5fa;
      --blue-soft:#dbeafe;
      --shadow:0 25px 60px rgba(15, 23, 42, 0.18);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color:var(--text);
      overflow:hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,192,203,0.45) 0, transparent 25%),
        radial-gradient(circle at 85% 15%, rgba(147,197,253,0.35) 0, transparent 22%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
    }

    .sky-glow{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.7), transparent 38%);
    }

    .mountain-wrap{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:38vh;
      pointer-events:none;
    }

    .mountain-back{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:min(1000px, 95vw);
      height:100%;
      background:
        linear-gradient(to top, rgba(59,130,246,0.18), rgba(59,130,246,0.05)),
        linear-gradient(135deg, transparent 49.5%, rgba(148,163,184,0.65) 50%),
        linear-gradient(225deg, transparent 49.5%, rgba(148,163,184,0.65) 50%);
      clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
      filter:blur(2px);
      opacity:.55;
    }

    .mountain-front{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:min(820px, 86vw);
      height:88%;
      background:
        linear-gradient(to bottom, #ffffff 0 12%, transparent 12%),
        linear-gradient(180deg, #cbd5e1, #94a3b8);
      clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
      box-shadow:0 -20px 40px rgba(255,255,255,0.25) inset;
      opacity:.9;
    }

    .sun{
      position:absolute;
      right:12%;
      top:9%;
      width:110px;
      height:110px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(251,113,133,0.95) 0%, rgba(251,113,133,0.75) 45%, rgba(251,113,133,0.12) 75%, transparent 76%);
      filter:blur(0.2px);
      opacity:.9;
      pointer-events:none;
    }

    .tree{
      position:absolute;
      bottom:0;
      width:220px;
      height:320px;
      pointer-events:none;
      opacity:.92;
    }

    .tree.left{ left:-10px; transform:scale(1.05); }
    .tree.right{ right:-10px; transform:scaleX(-1) scale(0.95); }

    .trunk{
      position:absolute;
      bottom:0;
      left:90px;
      width:24px;
      height:190px;
      background:linear-gradient(180deg, #7c5a47, #5b3f31);
      border-radius:12px;
    }

    .branch{
      position:absolute;
      background:#7c5a47;
      border-radius:999px;
      transform-origin:left center;
    }
    .b1{ left:96px; bottom:120px; width:90px; height:10px; transform:rotate(-24deg); }
    .b2{ left:30px; bottom:140px; width:78px; height:10px; transform:rotate(205deg); }
    .b3{ left:88px; bottom:165px; width:70px; height:9px; transform:rotate(-58deg); }
    .b4{ left:48px; bottom:90px; width:64px; height:9px; transform:rotate(210deg); }

    .bloom{
      position:absolute;
      background:
        radial-gradient(circle at 30% 30%, #fff 0 10%, transparent 11%),
        radial-gradient(circle, #fbcfe8 0 60%, #f472b6 61% 100%);
      border-radius:50%;
      box-shadow:0 8px 20px rgba(244,114,182,0.22);
    }
    .bl1{ width:88px; height:88px; left:120px; bottom:170px; }
    .bl2{ width:74px; height:74px; left:40px; bottom:190px; }
    .bl3{ width:66px; height:66px; left:108px; bottom:235px; }
    .bl4{ width:70px; height:70px; left:12px; bottom:120px; }
    .bl5{ width:58px; height:58px; left:145px; bottom:105px; }
    .bl6{ width:52px; height:52px; left:78px; bottom:105px; }

    .petal{
      position:absolute;
      top:-30px;
      width:15px;
      height:11px;
      background:linear-gradient(135deg, #ffd7ea, #f9a8d4);
      border-radius:65% 35% 65% 35%;
      opacity:.78;
      animation:fall linear infinite;
      pointer-events:none;
    }

    @keyframes fall{
      0%{
        transform:translate3d(0, -5vh, 0) rotate(0deg);
      }
      100%{
        transform:translate3d(var(--drift), 110vh, 0) rotate(360deg);
      }
    }

    .card{
      position:relative;
      z-index:2;
      width:min(980px, 100%);
      background:var(--card);
      border:1px solid var(--card-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:36px 28px 28px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      padding:9px 16px;
      border-radius:999px;
      font-weight:700;
      letter-spacing:.2px;
      background:linear-gradient(90deg, var(--pink-soft), var(--blue-soft));
      border:1px solid rgba(255,255,255,0.8);
      box-shadow:0 8px 18px rgba(15,23,42,0.06);
      margin-bottom:14px;
    }

    h1{
      margin:0;
      font-size:clamp(2.1rem, 5vw, 4.2rem);
      line-height:1.08;
    }

    .subtitle{
      margin:14px auto 0;
      max-width:760px;
      color:var(--muted);
      font-size:1.03rem;
      line-height:1.8;
    }

    .countdown{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:18px;
      margin:30px 0 22px;
    }

    .box{
      background:rgba(255,255,255,0.84);
      border:1px solid rgba(255,255,255,0.88);
      border-radius:24px;
      padding:24px 14px 20px;
      box-shadow:0 14px 28px rgba(15,23,42,0.08);
    }

    .number{
      font-size:clamp(2.2rem, 6vw, 4.2rem);
      font-weight:800;
      line-height:1;
      margin-bottom:10px;
      letter-spacing:1px;
    }

    .label{
      color:var(--muted);
      font-weight:700;
      font-size:1rem;
    }

    .info{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      margin-top:14px;
    }

    .pill{
      background:rgba(255,255,255,0.9);
      border:1px solid rgba(255,255,255,0.85);
      border-radius:999px;
      padding:11px 15px;
      color:#374151;
      box-shadow:0 8px 16px rgba(15,23,42,0.05);
      font-size:.96rem;
    }

    .done{
      margin-top:16px;
      font-size:1.12rem;
      font-weight:800;
      color:#be185d;
      min-height:1.5em;
    }

    @media (max-width: 760px){
      body{
        padding:16px;
      }
      .countdown{
        grid-template-columns:repeat(2, 1fr);
      }
      .card{
        padding:28px 16px 22px;
      }
      .tree{
        width:150px;
        height:230px;
        opacity:.8;
      }
      .tree.left{ left:-30px; }
      .tree.right{ right:-30px; }
      .sun{
        width:80px;
        height:80px;
        top:7%;
        right:6%;
      }
    }
  </style>
</head>
<body>
  <div class="sky-glow"></div>
  <div class="sun"></div>

  <div class="tree left">
    <div class="trunk"></div>
    <div class="branch b1"></div><div class="branch b2"></div><div class="branch b3"></div><div class="branch b4"></div>
    <div class="bloom bl1"></div><div class="bloom bl2"></div><div class="bloom bl3"></div><div class="bloom bl4"></div><div class="bloom bl5"></div><div class="bloom bl6"></div>
  </div>

  <div class="tree right">
    <div class="trunk"></div>
    <div class="branch b1"></div><div class="branch b2"></div><div class="branch b3"></div><div class="branch b4"></div>
    <div class="bloom bl1"></div><div class="bloom bl2"></div><div class="bloom bl3"></div><div class="bloom bl4"></div><div class="bloom bl5"></div><div class="bloom bl6"></div>
  </div>

  <div class="mountain-wrap">
    <div class="mountain-back"></div>
    <div class="mountain-front"></div>
  </div>

  <div class="card">
    <div class="badge">🌸 Sakura Countdown • Thailand Time</div>
    <h1>ญี่ปุ่นกำลังรออยู่!</h1>
    <p class="subtitle">
      นับถอยหลังสู่เที่ยวบินวันที่ <strong>11/04/2026 เวลา 07:55 น.</strong>
    </p>

    <div class="countdown">
      <div class="box">
        <div class="number" id="days">00</div>
        <div class="label">วัน</div>
      </div>
      <div class="box">
        <div class="number" id="hours">00</div>
        <div class="label">ชั่วโมง</div>
      </div>
      <div class="box">
        <div class="number" id="minutes">00</div>
        <div class="label">นาที</div>
      </div>
      <div class="box">
        <div class="number" id="seconds">00</div>
        <div class="label">วินาที</div>
      </div>
    </div>

    <div class="info">
      <div class="pill" id="targetText">เวลาเครื่องบินขึ้น: 11/04/2026 08:00 (ประเทศไทย)</div>
      <div class="pill" id="nowText">กำลังโหลดเวลาปัจจุบัน...</div>
    </div>

    <div class="done" id="doneText"></div>
  </div>

  <script>
    const bangkokTZ = 'Asia/Bangkok';
    const targetTime = new Date('2026-04-11T01:00:00Z').getTime();

    function pad(n){
      return String(n).padStart(2, '0');
    }

    function formatBangkok(date){
      return new Intl.DateTimeFormat('th-TH', {
        timeZone: bangkokTZ,
        dateStyle: 'full',
        timeStyle: 'medium'
      }).format(date);
    }

    function updateCountdown(){
      const now = new Date();

      document.getElementById('nowText').textContent =
        'เวลาปัจจุบันในไทย: ' + formatBangkok(now);

      let diff = targetTime - now.getTime();

      if(diff <= 0){
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.getElementById('doneText').textContent = 'ถึงเวลาออกเดินทางแล้ว ✈️🌸';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
      document.getElementById('doneText').textContent = '';
    }

    function createPetals(count){
      for(let i=0; i<count; i++){
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (8 + Math.random() * 10) + 's';
        petal.style.animationDelay = (-Math.random() * 18) + 's';
        petal.style.setProperty('--drift', (Math.random() * 220 - 110) + 'px');
        petal.style.opacity = 0.35 + Math.random() * 0.5;
        const size = 8 + Math.random() * 12;
        petal.style.width = size + 'px';
        petal.style.height = (size * 0.72) + 'px';
        document.body.appendChild(petal);
      }
    }

    createPetals(26);
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
